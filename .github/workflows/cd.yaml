name: Continuous Deployment

on:
  workflow_dispatch:
  repository_dispatch:
    types: [PR-merged]

permissions:
  contents: write
  discussions: write

jobs:
  deploy:
    runs-on: windows-2022
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
        ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_commit_sha || github.sha }}

    - name: Get USERPROFILE and set CACHE_PATH
      id: set_cache_path
      shell: pwsh
      run: |
        $userProfile = [System.Environment]::GetEnvironmentVariable("USERPROFILE")
        $cachePath = Join-Path $userProfile ".nuget\packages"
        echo "CACHE_PATH=$cachePath" >> $env:GITHUB_ENV

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.nuget/packages
          ${{ env.CACHE_PATH }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"

    - name: Restore dependencies
      run: dotnet restore PB-WebDAV.csproj

    - name: Build solution (Release, net48)
      run: dotnet publish PB-WebDAV.csproj --configuration Release --framework net48 --no-restore -p:DelaySign=true

    - name: Publish Native AOT (win-x64)
      run: dotnet publish PB-WebDAV.csproj --configuration Release --framework net10.0-windows -r win-x64

    - name: Publish Native AOT (win-x86)
      run: dotnet publish PB-WebDAV.csproj --configuration Release --framework net10.0-windows -r win-x86

    # ── ILRepack: merge all NuGet dependencies into a single DLL ──────────────
    - name: Install ILRepack
      run: dotnet tool install -g dotnet-ilrepack

    - name: Merge DLLs into single self-contained PBWebDAV.dll
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ${{ github.workspace }}\release-files -Force

        $publishDir = "${{ github.workspace }}\bin\Release\net48\publish"

        ilrepack `
          /out:${{ github.workspace }}\release-files\PBWebDAV.dll `
          /lib:$publishDir `
          /targetplatform:"v4,C:\Windows\Microsoft.NET\Framework\v4.0.30319" `
          /union `
          /copyattrs `
          /internalize `
          /keyfile:${{ github.workspace }}\PBWebDAV.snk `
          $publishDir\PBWebDAV.dll `
          $publishDir\System.IO.Pipelines.dll `
          $publishDir\System.Memory.dll `
          $publishDir\System.Buffers.dll `
          $publishDir\System.Numerics.Vectors.dll `
          $publishDir\System.Runtime.CompilerServices.Unsafe.dll `
          $publishDir\System.Threading.Tasks.Extensions.dll

    # ── Generate type library (.tlb) for COM consumers ─────────────────────────
    - name: Generate type library (PBWebDAV.tlb)
      shell: pwsh
      run: |
        # Use the 32-bit RegAsm to produce a TLB compatible with 32-bit PB 2019 R3.
        # /regfile suppresses registry writes; /tlb still generates the .tlb file.
        $regasm = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe"
        & $regasm "${{ github.workspace }}\release-files\PBWebDAV.dll" `
                  /tlb:"${{ github.workspace }}\release-files\PBWebDAV.tlb" `
                  /nologo

    # ── Stage release tree: net48 (merged DLL + TLB) + native-aot per RID ───────
    - name: Prepare release staging
      shell: pwsh
      run: |
        $projectRoot = "${{ github.workspace }}"
        $releaseRoot = Join-Path $projectRoot "release-files"
        $stagingDir  = Join-Path $releaseRoot "PBWebDAV-staging"
        New-Item -Path $stagingDir -ItemType Directory -Force | Out-Null

        $net48Dest = Join-Path $stagingDir "net48"
        New-Item -Path $net48Dest -ItemType Directory -Force | Out-Null
        Copy-Item (Join-Path $releaseRoot "PBWebDAV.dll") $net48Dest -Force
        Copy-Item (Join-Path $releaseRoot "PBWebDAV.tlb") $net48Dest -Force

        $aotBase = Join-Path $projectRoot "bin\Release\net10.0-windows"
        foreach ($rid in @("win-x64", "win-x86")) {
          $aotSrc  = Join-Path $aotBase "$rid\publish"
          $aotDest = Join-Path $stagingDir "native-aot\$rid"
          if (!(Test-Path $aotSrc)) {
            Write-Error "Native AOT publish output not found at: $aotSrc"
            exit 1
          }
          New-Item -Path $aotDest -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$aotSrc\*" -Destination $aotDest -Recurse -Force
        }

        Write-Host "Release staging contents:"
        Get-ChildItem -Path $stagingDir -Recurse -File | ForEach-Object {
          Write-Host $_.FullName.Replace($stagingDir, "")
        }

        echo "STAGING_DIR=$stagingDir" >> $env:GITHUB_ENV
        echo "RELEASE_ROOT=$releaseRoot" >> $env:GITHUB_ENV

    # ── Auto-version based on latest tag + commit messages ────────────────────
    - name: Get latest release version and generate release notes
      id: get_latest_release
      shell: pwsh
      run: |
        $latestRelease = ""
        try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -ErrorAction Stop
            $latestRelease = $response.tag_name
        } catch {
            Write-Host "No previous release found or API returned an error: $($_.Exception.Message)"
        }
        
        if (-not $latestRelease) { $latestRelease = "0.0.0" }
        Write-Output "Latest release version: $latestRelease"
        echo "latest_release=$latestRelease" >> $env:GITHUB_ENV

        $versionParts = $latestRelease.Split('.')
        $versionParts[-1] = [int]$versionParts[-1] + 1
        $newVersionString = $versionParts -join '.'

        # Allow commit messages like "Update Version To 1.2.0" to override the patch bump.
        $latestCommitMessages = (git log HEAD ^$latestRelease --pretty=%B 2>$null)
        foreach ($line in $latestCommitMessages) {
          if ($line -match "Update Version To (\d+\.\d+\.\d+)") {
            $messageParts = $line -split ' '
            $lastPart = $messageParts[-1]
            $currentParts  = $newVersionString -split '\.' | ForEach-Object { [int]$_ }
            $candidateParts = $lastPart          -split '\.' | ForEach-Object { [int]$_ }
            $upgrade = $false
            for ($i = 0; $i -lt [Math]::Min($currentParts.Count, $candidateParts.Count); $i++) {
              if ($currentParts[$i] -lt $candidateParts[$i]) { $upgrade = $true; break }
              elseif ($currentParts[$i] -gt $candidateParts[$i]) { break }
            }
            if ($upgrade) { $newVersionString = $lastPart }
          }
        }
        echo "new_release=$newVersionString" >> $env:GITHUB_ENV

        $releaseNotes  = "## Changes in $newVersionString`n"
        $releaseNotes += (git log HEAD ^$latestRelease --oneline 2>$null) -join "`n"
        $releaseNotes += "`n### Files changed`n"
        $releaseNotes += (git diff HEAD ^$latestRelease --compact-summary 2>$null) -join "`n"
        $releaseNotes | Out-File -FilePath releaseNotes.txt -Encoding utf8

    # ── Zip staging tree as PBWebDAV-{version}.zip ────────────────────────────
    - name: Create release archive
      shell: pwsh
      run: |
        $zipName = "PBWebDAV-${{ env.new_release }}.zip"
        $zipPath = Join-Path $env:RELEASE_ROOT $zipName
        $renamed = Join-Path (Split-Path $env:STAGING_DIR -Parent) "PBWebDAV-${{ env.new_release }}"
        Rename-Item -Path $env:STAGING_DIR -NewName (Split-Path $renamed -Leaf)
        Compress-Archive -Path $renamed -DestinationPath $zipPath -Force
        echo "zip_path=$zipPath" >> $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: |
          ${{ github.workspace }}\release-files\PBWebDAV.dll
          ${{ github.workspace }}\release-files\PBWebDAV.tlb
          ${{ env.zip_path }}
        tag_name: ${{ env.new_release }}
        name: ${{ env.new_release }}
        body_path: releaseNotes.txt
        fail_on_unmatched_files: true
